name: Verify

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      REQUIRE_AUDIT_SANDBOX: "1"
      SNS_MODE: dry-run
      QUIZ_BACKEND: file
      ADMIN_DEV_BYPASS: '0'
      INSTAGRAM_CAROUSEL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p verification-logs
          npm ci > verification-logs/install.log 2>&1
      - name: Run tests, type checks, and production build
        shell: bash
        run: |
          mkdir -p verification-logs
          result=0
          node --import tsx --test --test-concurrency=1 tests/*.test.mts tests/*.test.mjs > verification-logs/tests.log 2>&1 || result=1
          npm run build > verification-logs/build.log 2>&1 || result=1
          node node_modules/typescript/bin/tsc --noEmit --incremental false > verification-logs/typecheck.log 2>&1 || result=1
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs
          path: verification-logs/
          if-no-files-found: ignore
